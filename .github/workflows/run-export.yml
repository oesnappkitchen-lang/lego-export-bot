name: Lego Export (scheduled)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "30 6 * * *"  # هر روز 06:30 UTC

jobs:
  run-export:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BASE_URL: https://timekeepingkasra.snapp.cab/Lego.Web/
      USERNAME: k9100123
      PASSWORD: 0069494411

      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USER: oe.snappkitchen@gmail.com
      SMTP_PASS: ${{ secrets.SMTP_PASS }}   # ⬅️ در Settings > Secrets بنام SMTP_PASS ذخیره کن
      EMAIL_TO: oe.snappkitchen@gmail.com
      EMAIL_SUBJECT: "Lego.Web Daily Export"

      MENU_REPORT_TEXT: "گزارش بازدیدها"
      BTN_FETCH_TEXT: "دریافت"
      PLACEHOLDER_FROM: "از تاریخ"
      PLACEHOLDER_TO: "تا تاریخ"

      HEADLESS: "1"
      SLOW_MO_MS: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install playwright pandas openpyxl

      - name: Install Playwright (Chromium)
        run: |
          python -m playwright install --with-deps chromium

      - name: SMTP quick test
        run: |
          python - <<'PY'
          import smtplib, os
          from email.message import EmailMessage
          m=EmailMessage()
          m['From']=os.environ['SMTP_USER']
          m['To']=os.environ['EMAIL_TO']
          m['Subject']='SMTP test from GitHub Actions'
          m.set_content('This is a one-off test.')
          with smtplib.SMTP(os.environ['SMTP_HOST'], int(os.environ['SMTP_PORT'])) as s:
              s.ehlo(); s.starttls(); s.login(os.environ['SMTP_USER'], os.environ['SMTP_PASS']); s.send_message(m)
          print('SMTP OK')
          PY

      - name: Run python lego_export.py
        run: python lego_export.py
